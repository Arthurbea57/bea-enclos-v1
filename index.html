<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Béa à Aumetz — Les trois chemins</title>
<style>
  :root{
    --ui:#111827cc;
    --ui2:#0f172ae6;
    --txt:#f8fafc;
    --accent:#facc15;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    min-height:100vh;
    background:#0b1220;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--txt);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #wrap{
    width:min(100vw, 1100px);
    height:min(100vh, 760px);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{
    width:100%;
    height:100%;
    object-fit:contain;
    image-rendering:auto;
    background:#7db169;
    box-shadow:0 20px 60px #0008;
    border-radius:18px;
  }
  .hud{
    position:absolute;left:18px;top:18px;
    background:var(--ui);
    border:1px solid #ffffff22;
    backdrop-filter:blur(8px);
    border-radius:12px;
    padding:10px 12px;
    font-size:14px;
    line-height:1.45;
    pointer-events:none;
  }
  .hud b{color:var(--accent)}
  .hint{
    position:absolute;right:18px;top:18px;
    background:var(--ui);
    border:1px solid #ffffff22;
    border-radius:12px;
    padding:10px 12px;
    font-size:12px;
    line-height:1.45;
    text-align:right;
    pointer-events:none;
  }
  .mobile{
    position:absolute;left:0;right:0;bottom:16px;
    display:flex;justify-content:space-between;align-items:end;
    padding:0 16px;
    pointer-events:none;
  }
  .travel{
    position:absolute;right:18px;bottom:92px;display:none;gap:8px;
    flex-direction:column;align-items:stretch;padding:10px;
    background:#17221de8;border:1px solid #fff3;border-radius:14px;
    box-shadow:0 8px 24px #0007;
  }
  .travel.show{display:flex}
  .travel button{
    min-width:168px;padding:11px 12px;border:1px solid #fff3;border-radius:10px;
    color:#fff7df;background:#42613b;font:700 11px ui-monospace,monospace;
  }
  .travel button:last-child{background:#665126}
  .ride-button{
    position:absolute;right:18px;bottom:92px;display:none;min-width:185px;
    padding:13px;border:1px solid #ffe8a855;border-radius:12px;background:#7a5820ee;
    color:#fff7df;font:700 11px ui-monospace,monospace;box-shadow:0 8px 24px #0007;
  }
  .ride-button.show{display:block}
  .pet-button{
    position:absolute;right:18px;bottom:92px;display:none;padding:13px 18px;
    border:1px solid #fff5;border-radius:12px;background:#8a4769ee;color:white;
    font:700 11px ui-monospace,monospace;box-shadow:0 8px 24px #0007;
  }
  .pet-button.show{display:block}
  .dpad,.actions{display:grid;gap:8px;pointer-events:auto}
  .dpad{grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px}
  .dpad button,.actions button{
    border:none;border-radius:14px;background:#111827cc;color:#fff;
    font:700 18px ui-monospace,monospace;box-shadow:0 6px 16px #0005;
    border:1px solid #ffffff22;touch-action:none;
  }
  .dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
  .actions{grid-template-columns:64px 70px 78px}
  .actions button{height:60px;font-size:11px}
  .actions .jump{background:#315374cc}
  .actions .graze{background:#355e3bcc}
  .actions .headbutt{background:#6b2d2dcc}
  @media (hover:hover) and (pointer:fine){
    .mobile{opacity:.38}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="320"></canvas>

  <div class="hud">
    <div><b>BÉA</b> · <span id="zoneName">Enclos d’Aumetz</span></div>
    <div>🌿 Brouté : <span id="grassCount">0</span></div>
    <div>💥 Bigflo : <span id="bigfloHP">3</span>/3</div>
  </div>
  <div class="hint">
    Flèches / WASD : marcher<br>
    E : brouter · Espace : sauter<br>
    F : coup de tête
  </div>

  <div class="mobile">
    <div class="dpad">
      <button class="up" data-k="ArrowUp">▲</button>
      <button class="left" data-k="ArrowLeft">◀</button>
      <button class="down" data-k="ArrowDown">▼</button>
      <button class="right" data-k="ArrowRight">▶</button>
    </div>
    <div class="actions">
      <button class="jump" data-act="jump">SAUTER</button>
      <button class="graze" data-act="graze">BROUTER</button>
      <button class="headbutt" data-act="headbutt">COUP DE TÊTE</button>
    </div>
  </div>
  <div class="travel" id="travelMenu">
    <button data-go="place">ALLER À LA PLACE</button>
    <button data-go="chevalement">ALLER AU CHEVALEMENT</button>
  </div>
  <button class="ride-button" id="rideButton">MONTER DANS LA BENNE</button>
  <button class="pet-button" id="petButton">CARESSER BÉA</button>
</div>

<script>
const c = document.getElementById('game');
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = true;

const scenes = {
  enclos:Object.assign(new Image(),{src:'assets/aumetz-side-v4.png'}),
  place:Object.assign(new Image(),{src:'assets/place-aumetz-v4.png'}),
  chevalement:Object.assign(new Image(),{src:'assets/chemin-chevalement-v4.png'})
};
const goatAtlas = new Image();
goatAtlas.src = 'assets/chevres-v3.png';
const humanAtlas = new Image();
humanAtlas.src = 'assets/claire-arthur-v4.png';

const grassEl = document.getElementById('grassCount');
const hpEl = document.getElementById('bigfloHP');
const zoneEl = document.getElementById('zoneName');
const travelMenu = document.getElementById('travelMenu');
const rideButton = document.getElementById('rideButton');
const petButton = document.getElementById('petButton');

const keys = {};
const WORLD_W = 1200;
const GROUND_Y = 251;
let cameraX = 0;
let zone = 'enclos';
let transitionLock = 0;
let inBenne=false;
let petTimer=0;
let grassCount = 0;
let msg = "Bienvenue dans l’enclos de Béa";
let msgTimer = 180;
const combatMessages = [
  "C'est ciao",
  "CA N'A RIENNNN À VOIR",
  "Gros bébé Cadum",
  "Cassez-vous"
];

const world = {
  fence:{x:26,y:52,w:426,h:236},
  tunnel:{x:194,y:24,w:92,h:43},
  shed:{x:47,y:81,w:84,h:55},
};

const patches = Array.from({length:28}, (_,i)=>({
  x:62 + i*40,
  y:GROUND_Y,
  eaten:false,
  r:4 + (i%3)
}));

const obstacles = [
  {x:74,y:208,w:55,h:15,type:'log'},
  {x:330,y:212,w:26,h:20,type:'rock'},
  {x:360,y:95,w:20,h:18,type:'rock'},
  {x:147,y:106,w:16,h:13,type:'rock'}
];

const bea = {x:214,y:GROUND_Y,r:8,dir:1,speed:1.8,attack:0,graze:0,vy:0,onGround:true};
const beb = {x:390,y:GROUND_Y,r:8,dir:1,t:0};
const bigflo = {x:720,y:GROUND_Y,r:11,dir:-1,hp:3,stun:0,respawn:0,chain:0};
const chevalementPlatforms = [
  {x:365,w:65,y:222},
  {x:445,w:62,y:193},
  {x:520,w:65,y:164},
  {x:350,w:90,y:270,type:'benne'}
];
let reachedChevalementPlatform=false;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function zoneWidth(){return zone==='chevalement'?800:WORLD_W}
function cableY(x){const n=(x-400)/300;return 120+22*(1-n*n)}

function changeZone(next,entryX){
  zone=next;bea.x=entryX;bea.y=GROUND_Y;bea.vy=0;
  cameraX=clamp(entryX-190,0,WORLD_W-c.width);transitionLock=40;
  const names={enclos:"Enclos d’Aumetz",place:'Place du village',chevalement:'Chemin du chevalement'};
  zoneEl.textContent=names[zone];
  say(zone==='place'?'Béa arrive sur la place.':zone==='chevalement'?'Béa prend le chemin du chevalement.':'Retour dans l’enclos.');
}

function blocked(nx,ny){
  return nx < 32 || nx > zoneWidth()-32;
}

function update(){
  if(transitionLock>0) transitionLock--;
  let dx=0;
  if(keys.ArrowLeft||keys.a) dx--;
  if(keys.ArrowRight||keys.d) dx++;
  if(dx){
    const nx=bea.x+dx*bea.speed;
    if(!blocked(nx,bea.y)) bea.x=nx;
    if(dx) bea.dir=Math.sign(dx);
  }
  travelMenu.classList.toggle('show',zone==='enclos' && bea.x>WORLD_W-125);
  const closeToBenne=zone==='chevalement' && bea.x>325 && bea.x<465 && bea.y>235;
  rideButton.classList.toggle('show',closeToBenne);
  rideButton.textContent=inBenne?'DESCENDRE DE LA BENNE':'MONTER DANS LA BENNE';
  petButton.classList.toggle('show',zone==='place' && (Math.abs(bea.x-430)<75 || Math.abs(bea.x-720)<75));
  if(!transitionLock && zone!=='enclos' && bea.x<48 && (keys.ArrowLeft||keys.a)){
    changeZone('enclos',WORLD_W-85);
  }
  const previousY=bea.y;
  bea.vy += .46;
  bea.y += bea.vy;
  if(zone==='chevalement' && bea.vy>=0){
    for(const p of chevalementPlatforms){
      if(bea.x>p.x && bea.x<p.x+p.w && previousY<=p.y && bea.y>=p.y){
        bea.y=p.y;bea.vy=0;bea.onGround=true;
        if(p.y===164 && !reachedChevalementPlatform){reachedChevalementPlatform=true;say("Béa grimpe sur le chevalement !")}
        if(p.type==='benne' && !inBenne) say("La vieille benne est juste là.");
        break;
      }
    }
  }
  if(inBenne && bea.vy>=0){bea.y=270;bea.vy=0;bea.onGround=true}
  else if(bea.y>=GROUND_Y){bea.y=GROUND_Y;bea.vy=0;bea.onGround=true}
  if(inBenne && (bea.x<350 || bea.x>440 || bea.y<238)) inBenne=false;
  cameraX += (clamp(bea.x-190,0,zoneWidth()-c.width)-cameraX)*.08;
  if(bea.attack>0) bea.attack--;
  if(bea.graze>0) bea.graze--;
  if(msgTimer>0) msgTimer--;
  if(petTimer>0) petTimer--;

  // Beb: petit mouvement calme
  beb.t+=0.018;
  beb.x += Math.cos(beb.t)*0.12;

  // Bigflo suit Béa seulement à moyenne distance
  if(bigflo.respawn>0){
    bigflo.respawn--;
    if(bigflo.respawn===0){
      bigflo.hp=3; bigflo.x=720; bigflo.y=GROUND_Y; bigflo.stun=80;
      hpEl.textContent=bigflo.hp;
      say("Bigflo revient, chaîne au vent…");
    }
  } else if(bigflo.stun>0){
    bigflo.stun--;
  } else {
    const d=dist(bea,bigflo);
    if(d<120 && d>24){
      const vx=(bea.x-bigflo.x)/d, vy=(bea.y-bigflo.y)/d;
      bigflo.x += vx*0.42;
      bigflo.y += vy*0.42;
      if(vx) bigflo.dir=Math.sign(vx);
    }
    bigflo.chain += 0.12;
  }

  requestAnimationFrame(loop);
}

function say(t){ msg=t; msgTimer=150; }

function jump(){
  if(!bea.onGround) return;
  bea.vy=-7.2;bea.onGround=false;say("Hop !");
}

function graze(){
  if(bea.graze>0) return;
  bea.graze=50;
  if(zone==='place'){say("Pas d’herbe à brouter sur les pavés.");return}
  let best=null,bd=999;
  for(const p of patches){
    if(p.eaten) continue;
    const d=Math.hypot(p.x-bea.x,p.y-bea.y);
    if(d<bd){bd=d;best=p}
  }
  if(best && bd<22){
    best.eaten=true; grassCount++; grassEl.textContent=grassCount;
    say(grassCount%5===0 ? "Béa est très concentrée sur son herbe." : "Miam.");
  } else {
    say("Pas assez d’herbe sous le museau.");
  }
}

function headbutt(){
  if(bea.attack>0) return;
  bea.attack=24;
  if(bigflo.respawn>0) return;
  if(zone!=='enclos'){say("Bigflo est resté dans l’enclos.");return}
  const d=dist(bea,bigflo);
  if(d<34){
    bigflo.hp--;
    hpEl.textContent=bigflo.hp;
    const dx=bigflo.x-bea.x, dy=bigflo.y-bea.y, L=Math.max(1,Math.hypot(dx,dy));
    bigflo.x += dx/L*20; bigflo.y += dy/L*20;
    bigflo.stun=45;
    say(combatMessages[Math.floor(Math.random()*combatMessages.length)]);
    if(bigflo.hp<=0){
      bigflo.respawn=420;
      bigflo.x=-100; bigflo.y=-100;
    }
  } else {
    say("Béa donne un coup de tête dans le vide.");
  }
}

function drawBackground(){
  const scenery=scenes[zone];
  if(scenery.complete && scenery.naturalWidth){
    ctx.drawImage(scenery,-cameraX,0,zoneWidth(),c.height);

    // Les herbes broutables restent visibles et interactives sur le nouveau décor.
    for(const p of patches){
      if(zone!=='enclos') break;
      if(p.eaten) continue;
      ctx.strokeStyle='#d7bd4ccc';ctx.lineWidth=1;
      const px=p.x-cameraX;
      ctx.beginPath();ctx.moveTo(px,GROUND_Y+3);ctx.lineTo(px-2,GROUND_Y-3);
      ctx.moveTo(px,GROUND_Y+3);ctx.lineTo(px+2,GROUND_Y-4);ctx.stroke();
    }
    if(zone==='enclos'){
      const forkX=WORLD_W-105-cameraX;
      if(forkX<500){
        ctx.fillStyle='#49351f';ctx.fillRect(forkX,174,5,69);
        ctx.fillStyle='#5f4528';ctx.fillRect(forkX-49,176,54,17);ctx.fillRect(forkX,201,70,17);
        ctx.fillStyle='#fff4d4';ctx.font='bold 7px monospace';ctx.textAlign='center';
        ctx.fillText('ZONE DE SORTIE',forkX+8,187);ctx.fillText('CHOISIS TA ROUTE',forkX+35,212);ctx.textAlign='left';
      }
    } else if(cameraX<35){
      ctx.fillStyle='#17221ddd';ctx.fillRect(12,204,100,18);ctx.fillStyle='#fff4d4';ctx.font='bold 7px monospace';ctx.fillText('← RETOUR ENCLOS',22,216);
    }
    if(zone==='chevalement'){
      for(const p of chevalementPlatforms){
        const x=p.x-cameraX;
        if(p.type!=='benne'){
          ctx.fillStyle='#312f2a';ctx.fillRect(x,p.y,p.w,6);
          ctx.strokeStyle='#d0a525';ctx.lineWidth=2;ctx.strokeRect(x,p.y-4,p.w,9);
          ctx.strokeStyle='#655c49';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+8,p.y+5);ctx.lineTo(x+3,p.y+28);ctx.moveTo(x+p.w-8,p.y+5);ctx.lineTo(x+p.w-3,p.y+28);ctx.stroke();
        }
      }
    }
    return;
  }
  // Ciel lorrain en bandes douces, pour un effet de miniature peinte.
  const sky=ctx.createLinearGradient(0,0,0,78);
  sky.addColorStop(0,'#8fc7e6');sky.addColorStop(1,'#e5e4cf');
  ctx.fillStyle=sky;ctx.fillRect(0,0,480,92);
  ctx.fillStyle='#f7f0dc';ctx.fillRect(36,15,65,3);ctx.fillRect(76,9,36,2);ctx.fillRect(302,20,76,3);

  // Aumetz au loin : maisons claires et silhouette de l'église en pierre.
  ctx.fillStyle='#78906a';
  for(let i=0;i<24;i++){const x=(i*29)%480,h=8+(i*11)%19;ctx.fillRect(x,53-h,19,h)}
  const houses=[[0,55,48],[58,51,38],[105,57,44],[324,55,42],[371,50,46],[430,56,50]];
  for(const [x,y,w] of houses){
    ctx.fillStyle='#d8cbb1';ctx.fillRect(x,y,w,23);ctx.fillStyle='#a86149';
    ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+w/2,y-10);ctx.lineTo(x+w+3,y);ctx.fill();
    ctx.fillStyle='#68838d';ctx.fillRect(x+8,y+8,6,7);ctx.fillRect(x+w-15,y+8,6,7);
  }
  ctx.fillStyle='#8d8779';ctx.fillRect(151,27,24,48);ctx.fillRect(145,45,36,30);
  ctx.fillStyle='#6d685e';ctx.beginPath();ctx.moveTo(149,27);ctx.lineTo(163,11);ctx.lineTo(177,27);ctx.fill();
  ctx.fillRect(161,5,3,10);ctx.fillRect(157,9,11,2);
  ctx.fillStyle='#454843';ctx.beginPath();ctx.moveTo(157,74);ctx.lineTo(157,62);ctx.quadraticCurveTo(163,53,169,62);ctx.lineTo(169,74);ctx.fill();

  // Chevalement d'Aumetz : grandes jambes sombres, plateforme et détails jaunes.
  ctx.strokeStyle='#464743';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(405,73);ctx.lineTo(429,20);ctx.lineTo(453,73);ctx.moveTo(413,58);ctx.lineTo(446,58);ctx.stroke();
  ctx.fillStyle='#555651';ctx.fillRect(421,18,19,11);ctx.fillRect(417,27,27,5);
  ctx.strokeStyle='#dbb92e';ctx.lineWidth=2;ctx.strokeRect(421,15,19,8);
  ctx.beginPath();ctx.moveTo(411,67);ctx.lineTo(442,34);ctx.moveTo(419,67);ctx.lineTo(449,38);ctx.stroke();

  // Terrain irrégulier de l'enclos.
  const ground=ctx.createLinearGradient(0,52,0,288);
  ground.addColorStop(0,'#789e58');ground.addColorStop(.5,'#90b866');ground.addColorStop(1,'#718f4e');
  ctx.fillStyle=ground;ctx.fillRect(26,52,426,236);
  for(let i=0;i<135;i++){
    const x=30+(i*83)%418,y=60+(i*47)%221;
    ctx.fillStyle=i%4===0?'#b1a072':i%3===0?'#5d843f':'#799d54';
    ctx.fillRect(x,y,1+(i%3),1+(i%2));
  }

  // Chemin rural pâle qui remonte vers le vrai tunnel en moellons.
  ctx.fillStyle='#b8a77f';ctx.beginPath();ctx.moveTo(184,288);ctx.lineTo(218,66);ctx.lineTo(267,66);ctx.lineTo(302,288);ctx.fill();
  ctx.fillStyle='#d0c29e';
  for(let i=0;i<28;i++){const x=202+(i*31)%74,y=75+(i*41)%205;ctx.fillRect(x,y,2+(i%4),1)}

  // Pont/tunnel trapu, murs évasés et arche sombre comme sur la référence.
  ctx.fillStyle='#77756b';ctx.beginPath();ctx.moveTo(183,67);ctx.lineTo(194,27);ctx.lineTo(286,27);ctx.lineTo(298,67);ctx.fill();
  ctx.fillStyle='#65655e';ctx.fillRect(190,24,100,7);
  ctx.strokeStyle='#484b47';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(194,23);ctx.lineTo(194,16);ctx.lineTo(286,16);ctx.lineTo(286,23);ctx.stroke();
  for(let row=0;row<5;row++)for(let col=0;col<10;col++){
    const x=189+col*11+(row%2)*5,y=31+row*7;
    ctx.fillStyle=(col+row)%3===0?'#9c988a':'#858277';ctx.fillRect(x,y,8,4);
  }
  ctx.fillStyle='#222824';ctx.beginPath();ctx.arc(240,67,27,Math.PI,Math.PI*2);ctx.lineTo(267,67);ctx.lineTo(267,47);ctx.lineTo(213,47);ctx.lineTo(213,67);ctx.fill();
  ctx.fillStyle='#d9cfb6';ctx.beginPath();ctx.arc(240,67,5,Math.PI,Math.PI*2);ctx.lineTo(245,67);ctx.lineTo(235,67);ctx.fill();
  ctx.fillStyle='#f4edd9';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('VERS LA PLACE',240,11);ctx.textAlign='left';

  // Petit abri rustique avec planches, toiture et profondeur intérieure.
  ctx.fillStyle='#3a2b22';ctx.fillRect(47,82,84,55);
  for(let x=50;x<130;x+=9){ctx.fillStyle=x%18?'#604532':'#76553b';ctx.fillRect(x,84,7,51)}
  ctx.fillStyle='#392b24';ctx.beginPath();ctx.moveTo(39,83);ctx.lineTo(88,62);ctx.lineTo(141,83);ctx.fill();
  ctx.fillStyle='#806148';ctx.beginPath();ctx.moveTo(44,79);ctx.lineTo(88,65);ctx.lineTo(136,79);ctx.lineTo(132,84);ctx.lineTo(88,70);ctx.lineTo(47,85);ctx.fill();
  ctx.fillStyle='#171918';ctx.fillRect(67,104,40,33);ctx.fillStyle='#a17a50';ctx.fillRect(64,101,46,4);

  // Herbes hautes sur la droite, en direction du chevalement.
  for(let i=0;i<90;i++){
    const x=299+(i*37)%146,y=76+(i*29)%187,h=5+(i%9);
    ctx.strokeStyle=i%3===0?'#8fa44f':i%2?'#526f35':'#6f873d';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y+h);ctx.quadraticCurveTo(x+(i%3)-1,y+3,x-2,y-h);ctx.stroke();
  }

  // herbes broutables
  for(const p of patches){
    if(p.eaten) continue;
    ctx.strokeStyle='#356b2f';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p.x,p.y+4);ctx.lineTo(p.x-2,p.y-4);
    ctx.moveTo(p.x,p.y+4);ctx.lineTo(p.x+2,p.y-5);ctx.stroke();
  }

  // Obstacles avec lumière et ombre.
  for(const o of obstacles){
    if(o.type==='log'){
      ctx.fillStyle='#34402d55';ctx.fillRect(o.x+4,o.y+o.h,o.w,4);
      ctx.fillStyle='#65452e';ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#9b7048';ctx.fillRect(o.x+3,o.y+2,o.w-7,3);ctx.fillStyle='#3f2a20';ctx.fillRect(o.x+o.w-5,o.y+2,5,o.h-3);
    } else {
      ctx.fillStyle='#53604766';ctx.fillRect(o.x+3,o.y+o.h,o.w,3);
      ctx.fillStyle='#737a71';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+3,o.y+5);ctx.lineTo(o.x+o.w-7,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill();
      ctx.fillStyle='#a4aa9d';ctx.fillRect(o.x+5,o.y+4,o.w-11,3);
    }
  }

  // Clôture au premier plan, posée après le décor pour donner du relief.
  ctx.strokeStyle='#4d3828';ctx.lineCap='round';
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(26,53);ctx.lineTo(452,53);ctx.moveTo(26,287);ctx.lineTo(452,287);ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(26,87);ctx.lineTo(452,87);ctx.moveTo(26,253);ctx.lineTo(452,253);ctx.stroke();
  for(let x=29;x<454;x+=31){ctx.fillStyle='#6d4c32';ctx.fillRect(x-2,48,5,43);ctx.fillRect(x-2,248,5,44);ctx.fillStyle='#9b714b';ctx.fillRect(x-1,49,1,39);ctx.fillRect(x-1,249,1,39)}
  ctx.lineCap='butt';
}

function goat(g, kind){
  if(goatAtlas.complete && goatAtlas.naturalWidth){
    const sprite = kind==='bea'
      ? {sx:12,sy:292,sw:520,sh:548,w:38,h:40}
      : kind==='beb'
        ? {sx:520,sy:270,sw:520,sh:580,w:35,h:37}
        : {sx:1010,sy:72,sw:650,sh:790,w:52,h:57};
    const moving = kind==='bea' && (keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown);
    const bob = moving ? Math.sin(performance.now()/85)*1.1 : 0;
    const attackPush = kind==='bea' && bea.attack>0 ? 6 : 0;
    const grazeTilt = kind==='bea' && bea.graze>0 ? .12 : 0;

    ctx.save();
    ctx.translate(g.x,g.y+bob);
    ctx.scale(g.dir,1);
    ctx.rotate(grazeTilt);
    ctx.translate(attackPush,-sprite.h+11);
    ctx.drawImage(goatAtlas,sprite.sx,sprite.sy,sprite.sw,sprite.sh,-sprite.w/2,0,sprite.w,sprite.h);
    if(kind==='bea'){
      // Béa est entièrement noire : la marque claire est réservée à Beb.
      ctx.fillStyle='#171817';
      ctx.beginPath();ctx.ellipse(sprite.w*.25,sprite.h*.17,2.3,3.2,-.2,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();

    const label=kind.toUpperCase();ctx.font='bold 7px monospace';
    const labelW=ctx.measureText(label).width+9;
    ctx.fillStyle='#17221de6';ctx.fillRect(g.x-labelW/2,g.y-sprite.h-4,labelW,10);
    ctx.fillStyle='#fff7df';ctx.textAlign='center';ctx.fillText(label,g.x,g.y-sprite.h+3);ctx.textAlign='left';
    return;
  }
  const s = kind==='bigflo'?1.28:1;
  const bob = (kind==='bea' && (keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown)) ? Math.sin(performance.now()/85)*.7 : 0;
  ctx.save();ctx.translate(g.x,g.y);ctx.scale(g.dir*s,s);
  ctx.fillStyle='#26332255';ctx.beginPath();ctx.ellipse(0,9,12,4,0,0,Math.PI*2);ctx.fill();
  ctx.translate(0,bob);

  // Silhouette plus organique : ventre rond, poitrail, museau et grandes oreilles.
  ctx.fillStyle='#171918';ctx.beginPath();ctx.ellipse(-2,-1,11,7,-.08,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(6,-7,6,9,.18,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(12,-12,7,5,.12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#242625';ctx.beginPath();ctx.ellipse(-4,-4,7,3,-.15,0,Math.PI*2);ctx.fill();

  // Pattes fines et sabots fendus.
  ctx.strokeStyle='#141615';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-7,4);ctx.lineTo(-8,13);ctx.moveTo(4,4);ctx.lineTo(5,13);ctx.stroke();
  ctx.fillStyle='#080909';ctx.fillRect(-10,12,4,2);ctx.fillRect(4,12,4,2);

  // Oreilles expressives et cornes ivoire.
  ctx.fillStyle='#121413';ctx.beginPath();ctx.ellipse(8,-17,6,2,-.35,0,Math.PI*2);ctx.ellipse(16,-16,7,2,.25,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#c7b997';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,-16);ctx.lineTo(9,-21);ctx.moveTo(14,-16);ctx.lineTo(15,-20);ctx.stroke();
  ctx.fillStyle='#eee8d6';ctx.beginPath();ctx.arc(14,-13,1.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171918';ctx.fillRect(14,-14,1,2);
  ctx.fillStyle='#343735';ctx.beginPath();ctx.ellipse(18,-10,3,2,0,0,Math.PI*2);ctx.fill();

  if(kind==='beb'){
    ctx.fillStyle='#eee9d7';ctx.beginPath();ctx.ellipse(11,-15,4,3,-.15,0,Math.PI*2);ctx.fill();
  }
  if(kind==='bigflo'){
    ctx.fillStyle='#0c0d0d';ctx.beginPath();ctx.moveTo(16,-8);ctx.lineTo(21,-3);ctx.lineTo(16,2);ctx.fill();
    // Gros collier métallique et chaîne qui pend franchement sur le poitrail.
    ctx.strokeStyle='#c7aa54';ctx.lineWidth=2;ctx.beginPath();ctx.arc(7,-8,6,.3,2.5);ctx.stroke();
    const swing=Math.sin(bigflo.chain)*2;
    ctx.strokeStyle='#d4b85e';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(5,-5);ctx.quadraticCurveTo(3+swing,5,-3+swing,8);ctx.stroke();
    for(let i=0;i<5;i++){ctx.strokeRect(4-i*1.7+swing*i/5,-3+i*2.2,2.5,3.2)}
  }
  if(kind==='bea' && bea.graze>0){
    ctx.rotate(0.15);ctx.translate(4,4);
  }
  if(kind==='bea' && bea.attack>0){
    ctx.translate(6,0);
  }
  ctx.restore();

  // Nom discret, façon petite pancarte peinte.
  ctx.font='bold 7px monospace';ctx.textAlign='center';
  const label=kind.toUpperCase(),w=ctx.measureText(label).width+10;
  ctx.fillStyle='#263126cc';ctx.fillRect(g.x-w/2,g.y-29,w,10);
  ctx.fillStyle='#f5efd9';ctx.fillText(label,g.x,g.y-22);ctx.textAlign='left';
}

function drawCableInstallation(){
  if(zone!=='chevalement') return;
  const left=100-cameraX,right=700-cameraX;
  ctx.strokeStyle='#242522';ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=100;x<=700;x+=8){
    const sx=x-cameraX,y=cableY(x);
    if(x===100)ctx.moveTo(sx,y);else ctx.lineTo(sx,y);
  }
  ctx.stroke();
  ctx.strokeStyle='#343630';ctx.lineWidth=3;
  for(const x of [left,right]){
    ctx.beginPath();ctx.moveTo(x-15,238);ctx.lineTo(x,105);ctx.lineTo(x+15,238);
    ctx.moveTo(x-12,202);ctx.lineTo(x+12,202);ctx.moveTo(x-9,165);ctx.lineTo(x+9,165);
    ctx.moveTo(x-5,125);ctx.lineTo(x+5,125);ctx.stroke();
  }
}

function drawMovingBenne(){
  if(!inBenne || zone!=='chevalement') return;
  const x=350-cameraX;
  ctx.fillStyle='#282824cc';ctx.fillRect(x,263,90,8);
  ctx.strokeStyle='#8a672f';ctx.lineWidth=2;ctx.strokeRect(x,262,90,9);
}

function drawPeople(){
  if(zone!=='place' || !humanAtlas.complete || !humanAtlas.naturalWidth) return;
  const people=[
    {name:'ARTHUR',x:430,sx:235,sy:20,sw:470,sh:965,w:52,h:107},
    {name:'CLAIRE',x:720,sx:845,sy:50,sw:405,sh:930,w:47,h:104}
  ];
  for(const p of people){
    const x=p.x-cameraX;
    ctx.drawImage(humanAtlas,p.sx,p.sy,p.sw,p.sh,x-p.w/2,GROUND_Y-p.h,p.w,p.h);
    ctx.fillStyle='#17221ddd';ctx.fillRect(x-24,GROUND_Y-p.h-12,48,10);
    ctx.fillStyle='#fff7df';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText(p.name,x,GROUND_Y-p.h-5);ctx.textAlign='left';
  }
  if(petTimer>0){
    const x=bea.x-cameraX,y=bea.y-48;
    ctx.fillStyle='#ff739d';ctx.font='12px sans-serif';ctx.fillText('♥',x-11,y);ctx.fillText('♥',x+7,y-7);
  }
}

function sceneReady(){
  const scenery=scenes[zone];
  if(!scenery.complete || !scenery.naturalWidth) return false;
  if(!goatAtlas.complete || !goatAtlas.naturalWidth) return false;
  if(zone==='place' && (!humanAtlas.complete || !humanAtlas.naturalWidth)) return false;
  return true;
}

function drawLoading(){
  ctx.fillStyle='#17221d';ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#facc15';ctx.font='bold 15px monospace';ctx.textAlign='center';
  ctx.fillText('CHARGEMENT DE BÉA…',c.width/2,c.height/2-8);
  ctx.fillStyle='#fff7df';ctx.font='9px monospace';
  ctx.fillText('Les chemins d’Aumetz arrivent',c.width/2,c.height/2+14);
  ctx.textAlign='left';
}

function draw(){
  if(!sceneReady()){drawLoading();return}
  drawBackground();
  drawPeople();
  if(zone==='enclos') goat({...beb,x:beb.x-cameraX},'beb');
  if(zone==='enclos' && bigflo.respawn===0) goat({...bigflo,x:bigflo.x-cameraX},'bigflo');
  goat({...bea,x:bea.x-cameraX},'bea');
  drawMovingBenne();

  if(msgTimer>0){
    ctx.fillStyle='#111827dd';ctx.fillRect(126,290,228,20);
    ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.textAlign='center';
    ctx.fillText(msg,240,303);ctx.textAlign='left';
  }
}

function loop(){draw();update()}
requestAnimationFrame(loop);

window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.key==='e'||e.key==='E')graze();
  if(e.key===' ')jump();
  if(e.key==='f'||e.key==='F')headbutt();
});
window.addEventListener('keyup',e=>keys[e.key]=false);

document.querySelectorAll('[data-k]').forEach(btn=>{
  const k=btn.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true};
  const off=e=>{e.preventDefault();keys[k]=false};
  btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);
  btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
});
document.querySelector('[data-act="graze"]').addEventListener('pointerdown',e=>{e.preventDefault();graze()});
document.querySelector('[data-act="headbutt"]').addEventListener('pointerdown',e=>{e.preventDefault();headbutt()});
document.querySelector('[data-act="jump"]').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.querySelectorAll('[data-go]').forEach(btn=>btn.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(zone==='enclos' && bea.x>WORLD_W-125) changeZone(btn.dataset.go,55);
}));
rideButton.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(zone==='chevalement' && bea.x>325 && bea.x<465){
    if(inBenne){
      inBenne=false;bea.x=455;bea.y=GROUND_Y;bea.vy=0;bea.onGround=true;say("Béa descend de la benne.");
    }else{
      inBenne=true;bea.x=395;bea.y=270;bea.vy=0;bea.onGround=true;say("Béa monte dans la benne ! Elle reste jouable.");
    }
  }
});
petButton.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(zone!=='place') return;
  const arthur=Math.abs(bea.x-430),claire=Math.abs(bea.x-720);
  if(Math.min(arthur,claire)<75){
    petTimer=150;
    say((arthur<claire?'Arthur':'Claire')+' caresse Béa ♥');
  }
});
</script>
</body>
</html>
